name: Update site data

# Regenerates the JSON the site paints on first frame and commits whatever changed:
#   data/stats.json  - engine buyback & burn baseline
#   data/herd.json   - holder census + leaderboard
#   data/buys.json   - Live Buys feed
# Without this they go stale and every visitor sees old numbers. Each script keeps
# the previous file when a scan fails, so a rate-limited run publishes nothing
# rather than blanking a section.
on:
  schedule:
    # Offset from the top of the hour — */15 is a heavily contended slot on GitHub
    # and scheduled runs get queued. Delivery is best-effort either way.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate baseline from chain
        env:
          # Optional. Falls back to the public mainnet RPC, which is rate-limited —
          # the scans retry with backoff, but set this secret to the Helius URL
          # for reliability.
          RPC_URL: ${{ secrets.RPC_URL }}
          # update-herd lifts the key off RPC_URL when this is unset; it is only
          # needed if the Enhanced Transactions API key differs from the RPC one.
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
        run: |
          # pipefail, or the `| tee` below would swallow a hard crash in
          # update-stats and report the step as successful.
          set -o pipefail
          node scripts/update-stats.mjs 2>&1 | tee engine.log
          node scripts/update-herd.mjs

      # always(), because each script keeps its previous file on failure and writes
      # independently — so whatever DID refresh should still ship even if a later
      # script died. One broken dataset must not hold the others hostage.
      - name: Commit if changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "bullcember-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh site data (engine, herd, buys)"
          git push

      # Runs AFTER the commit on purpose. update-stats catches a failed scan and keeps
      # the previous event log — right for the site, but it would leave this job green
      # while the engine sat frozen. Failing here still lets the herd/buys refresh land;
      # it just turns the run red so it is visible instead of silent.
      - name: Flag a stale engine
        if: always()
        run: |
          failed=0
          if [ -f engine.log ] && grep -q "engine scan failed" engine.log; then
            echo "::error::Buyback and burn scan did not finish. The event log was left unchanged so the cursor cannot skip a missed transaction."
            failed=1
          fi
          exit $failed
